<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>FoldMax VR - Molecular Visualizer</title>
    <meta name="description" content="FoldMax VR - Immersive molecular visualization in VR">
    <link rel="stylesheet" href="css/splash.css">

    <!-- A-Frame (Includes Three.js) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- Libraries -->
    <script src="js/libs/jquery-1.9.1.min.js"></script>

    <!-- VRmol Core Libs -->
    <script src="libs/extension.js"></script>
    <script src="libs/w3m.js"></script>
    <script src="libs/static.js"></script>
    <script src="libs/math.js"></script>
    <script src="libs/core.js"></script>

    <!-- Adapter -->
    <script src="libs/render-aframe.js"></script>

    <!-- More VRmol Libs -->
    <script src="libs/loader.js"></script>
    <script src="libs/tool.js"></script>
    <script src="libs/drawer.js"></script>
    <script src="libs/painter.js"></script>
    <script src="libs/controller.js"></script>
    <script src="libs/pdbparser.js"></script>
    <script src="libs/emparser.js"></script>
    <script src="libs/surface.js"></script>

    <!-- A-Frame Components -->
    <script src="js/aframe-components/environment-component.js"></script>
    <script src="js/aframe-components/molecular-renderer.js"></script>
    <script src="js/aframe-components/radial-menu-component.js"></script>
    <script src="js/aframe-components/movement-debug.js"></script>
    <script src="js/aframe-components/vr-debug-panel.js"></script>
    <script src="js/aframe-components/vr-console.js"></script>
    <script src="js/aframe-components/controller-radial-menu.js"></script>
    <script src="js/aframe-components/axis-transform-controls.js"></script>

    <script>
        // One-time initialization
        window.addEventListener('load', function () {
            if (PDB.render && PDB.render.init) {
                PDB.render.init();
            }
        });
    </script>
</head>

<body>

    <!-- =============================================
         SPLASH SCREEN
         ============================================= -->
    <div id="splash-screen">
        <!-- Animated background -->
        <div id="splash-bg"></div>

        <!-- Floating particles (generated by JS) -->
        <div id="splash-particles"></div>

        <!-- Main card -->
        <div id="splash-card">
            <span id="splash-version">v0.1 Alpha</span>

            <!-- Logo placeholder -->
            <div id="splash-logo-area">
                <div id="splash-logo-inner">
                    <!-- Replace <img> below with your logo when ready -->
                    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Molecule icon -->
                        <circle cx="26" cy="26" r="6" fill="rgba(0,220,200,0.9)" />
                        <circle cx="10" cy="16" r="4" fill="rgba(0,180,255,0.8)" />
                        <circle cx="42" cy="16" r="4" fill="rgba(0,180,255,0.8)" />
                        <circle cx="10" cy="36" r="4" fill="rgba(80,120,255,0.8)" />
                        <circle cx="42" cy="36" r="4" fill="rgba(80,120,255,0.8)" />
                        <circle cx="26" cy="6" r="3" fill="rgba(0,220,200,0.6)" />
                        <circle cx="26" cy="46" r="3" fill="rgba(0,220,200,0.6)" />
                        <line x1="26" y1="20" x2="13" y2="18" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                        <line x1="26" y1="20" x2="39" y2="18" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                        <line x1="26" y1="32" x2="13" y2="34" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                        <line x1="26" y1="32" x2="39" y2="34" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                        <line x1="26" y1="20" x2="26" y2="9" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                        <line x1="26" y1="32" x2="26" y2="43" stroke="rgba(0,220,200,0.4)" stroke-width="1.5" />
                    </svg>
                    <span>FoldMax VR</span>
                </div>
            </div>

            <h1 id="splash-title">FoldMax VR</h1>
            <p id="splash-subtitle">Molecular Visualization</p>

            <div class="splash-divider"></div>

            <!-- Navigation menu -->
            <nav id="splash-menu">

                <!-- Enter Simulation -->
                <button class="splash-btn primary" id="btn-enter-sim">
                    <div class="splash-btn-icon">⬡</div>
                    <div class="splash-btn-text">
                        <span class="splash-btn-label">Enter Simulation</span>
                        <span class="splash-btn-desc">Launch the VR molecular environment</span>
                    </div>
                    <span class="splash-btn-arrow">›</span>
                </button>

                <!-- Settings -->
                <button class="splash-btn" id="btn-settings">
                    <div class="splash-btn-icon">⚙</div>
                    <div class="splash-btn-text">
                        <span class="splash-btn-label">Settings</span>
                        <span class="splash-btn-desc">Graphics, controls & preferences</span>
                    </div>
                    <span class="splash-btn-arrow">›</span>
                </button>

                <!-- Help -->
                <button class="splash-btn" id="btn-help">
                    <div class="splash-btn-icon">?</div>
                    <div class="splash-btn-text">
                        <span class="splash-btn-label">Help</span>
                        <span class="splash-btn-desc">Controls, tips & documentation</span>
                    </div>
                    <span class="splash-btn-arrow">›</span>
                </button>

                <!-- Multiplayer (placeholder) -->
                <button class="splash-btn disabled" id="btn-multiplayer" title="Coming soon">
                    <div class="splash-btn-icon">◈</div>
                    <div class="splash-btn-text">
                        <span class="splash-btn-label">Multiplayer &nbsp;<small
                                style="font-size:10px;color:rgba(0,220,200,0.6);font-weight:700;letter-spacing:.1em">SOON</small></span>
                        <span class="splash-btn-desc">Collaborate in shared VR sessions</span>
                    </div>
                    <span class="splash-btn-arrow">›</span>
                </button>

            </nav>
        </div>

        <p id="splash-footer">Quest 3 · WebXR · A-Frame 1.4</p>
    </div>
    <!-- END SPLASH SCREEN -->
    <a-scene background="color: #000">
        <!-- Procedural Environment -->
        <a-entity environment-loader="timeOfDay: 0.35"></a-entity>

        <!-- Molecule Container (Target for controls) -->
        <a-entity id="molecule-container" position="0 1.6 -2" molecular-renderer="pdbId: 1cbs"
            axis-transform-controls="hand: right">
        </a-entity>

        <!-- VR Controls -->
        <a-entity id="rig" position="0 0 0" movement-controls="fly: true; speed: 0.5" movement-debug>
            <a-entity id="camera" camera look-controls wasd-controls></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left" laser-controls="hand: left"
                raycaster="objects: .clickable; far: 5"></a-entity>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" laser-controls="hand: right"
                raycaster="objects: .clickable; far: 5" controller-radial-menu></a-entity>
        </a-entity>

        <!-- Radial Menu -->
        <a-entity id="radial-menu" radial-menu class="clickable"></a-entity>

        <!-- VR Debug Panel (Toggle with X key) -->
        <a-entity vr-debug-panel></a-entity>

        <!-- VR Console - Shows logs in headset -->
        <a-entity vr-console></a-entity>

        <!-- Mouse Cursor for Desktop -->
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <!-- Hidden DOM elements for compatibility with tool.js -->
    <div id="segmentholder" style="display:none;"></div>
    <div id="labelContent" style="display:none;"></div>
    <div id="labelContent_measure" style="display:none;"></div>
    <div id="rightmenu" style="display:none;"></div>

    <!-- =============================================
         SPLASH SCREEN LOGIC
         ============================================= -->
    <script>
        (function () {
            'use strict';

            /* ---- Floating particles ---- */
            var container = document.getElementById('splash-particles');
            var COLORS = ['rgba(0,220,200,', 'rgba(0,160,255,', 'rgba(80,120,255,'];
            for (var i = 0; i < 28; i++) {
                var p = document.createElement('div');
                p.className = 'splash-particle';
                var size = Math.random() * 4 + 2;
                var color = COLORS[Math.floor(Math.random() * COLORS.length)];
                p.style.cssText = [
                    'width:' + size + 'px',
                    'height:' + size + 'px',
                    'left:' + Math.random() * 100 + '%',
                    'bottom:' + (Math.random() * -20) + 'px',
                    'background:' + color + (Math.random() * 0.5 + 0.3) + ')',
                    'animation-duration:' + (Math.random() * 12 + 8) + 's',
                    'animation-delay:' + (Math.random() * 8) + 's'
                ].join(';');
                container.appendChild(p);
            }

            /* ---- Dismiss splash ---- */
            function dismissSplash() {
                var splash = document.getElementById('splash-screen');
                splash.classList.add('hidden');
                // Remove from DOM after fade completes
                setTimeout(function () {
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                }, 900);
            }

            /* ---- Enter Simulation ---- */
            document.getElementById('btn-enter-sim').addEventListener('click', function () {
                dismissSplash();
            });

            /* ---- Settings (stub) ---- */
            document.getElementById('btn-settings').addEventListener('click', function () {
                // TODO: open settings panel
                alert('Settings panel coming soon!\n\nFor now, use the in-VR radial menu (B button) to adjust settings.');
            });

            /* ---- Help (stub) ---- */
            document.getElementById('btn-help').addEventListener('click', function () {
                // TODO: open help panel
                alert(
                    'FoldMax VR Controls\n' +
                    '─────────────────\n' +
                    'B button  →  Open radial menu\n' +
                    'Left grip  →  Move menu closer\n' +
                    'Right grip →  Move menu farther\n' +
                    'Trigger    →  Select / click\n' +
                    'Thumbstick →  Move around\n\n' +
                    'Desktop:\n' +
                    'M key  →  Toggle menu\n' +
                    'WASD   →  Move\n' +
                    'Mouse  →  Look around'
                );
            });

            /* ---- Keyboard shortcut: Enter key ---- */
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && document.getElementById('splash-screen')) {
                    dismissSplash();
                }
            });

        })();
    </script>
</body>

</html>
