<head>
    <meta charset="utf-8">
    <title>VRmol - A-Frame Edition</title>
    <meta name="description" content="VRmol ported to A-Frame">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <script src="js/libs/jquery-1.9.1.min.js"></script>

    <script src="libs/extension.js"></script>
    <script src="libs/w3m.js"></script>
    <script src="libs/static.js"></script>
    <script src="libs/math.js"></script>
    <script src="libs/core.js"></script>

    <!-- Adapter -->
    <script src="libs/render-aframe.js"></script>

    <!-- More VRmol Libs -->
    <script src="libs/loader.js"></script>
    <script src="libs/tool.js"></script>
    <script src="libs/drawer.js"></script>
    <script src="libs/painter.js"></script>
    <script src="libs/controller.js"></script>
    <script src="libs/pdbparser.js"></script>
    <script src="libs/emparser.js"></script>
    <script src="libs/surface.js"></script>

    <!-- A-Frame Components -->
    <script src="js/aframe-components/environment-component.js"></script>
    <script src="js/aframe-components/molecular-renderer.js"></script>
    <script src="js/aframe-components/radial-menu-component.js?v=clean"></script>
    <script src="js/aframe-components/movement-debug.js"></script>
    <script src="js/aframe-components/vr-debug-panel.js"></script>
    <script src="js/aframe-components/vr-console.js"></script>
    <script>
        /**
         * ANNOTATION SYSTEM BUNDLE (INLINED)
         */
        console.log('[AnnotationSystem] INLINED SCRIPT STARTING...');

        // 1. ANNOTATION MANAGER
        AFRAME.registerSystem('annotation-manager', {
            init: function () {
                console.log('[AnnotationManager] System Initializing...');
                this.annotations = [];
                this.pdbId = null;
                this.el.addEventListener('pdb-loading-start', (evt) => {
                    this.pdbId = evt.detail.pdbId;
                    this.loadAnnotations();
                });
                this.el.addEventListener('pin-annotation', (evt) => {
                    this.addAnnotation(evt.detail.atomData, evt.detail.position);
                });
                this.el.addEventListener('clear-annotations', () => {
                    this.clearAll();
                });
                console.log('[AnnotationManager] System Ready');
            },
            addAnnotation: function (atomData, position) {
                if (!this.pdbId) console.warn('[AnnotationManager] No PDB loaded.');
                var id = atomData.chainname + '_' + atomData.resid + '_' + atomData.name;
                var existing = this.annotations.find(a => a.id === id);
                if (existing) return;
                var annotation = {
                    id: id,
                    pos: { x: position.x, y: position.y, z: position.z },
                    text: this.formatText(atomData),
                    atomData: atomData,
                    timestamp: Date.now()
                };
                this.annotations.push(annotation);
                this.spawnLabel(annotation);
                this.save();
            },
            clearAll: function () {
                var labels = document.querySelectorAll('[annotation-label]');
                labels.forEach(el => {
                    if (el.classList.contains('pinned-annotation')) el.parentNode.removeChild(el);
                });
                this.annotations = [];
                this.save();
                console.log('[AnnotationManager] Cleared all annotations');
            },
            spawnLabel: function (data) {
                var el = document.createElement('a-entity');
                el.classList.add('pinned-annotation');
                el.setAttribute('annotation-label', {
                    text: data.text,
                    targetPos: data.pos
                });
                this.el.sceneEl.appendChild(el);
            },
            formatText: function (atom) {
                return `${atom.resname} ${atom.resid}\n${atom.name} (${atom.chainname})`;
            },
            save: function () {
                if (!this.pdbId) return;
                var key = 'vrmol_annotations_' + this.pdbId;
                localStorage.setItem(key, JSON.stringify(this.annotations));
            },
            loadAnnotations: function () {
                var labels = document.querySelectorAll('.pinned-annotation');
                labels.forEach(el => el.parentNode.removeChild(el));
                if (!this.pdbId) return;
                var key = 'vrmol_annotations_' + this.pdbId;
                var saved = localStorage.getItem(key);
                if (saved) {
                    try {
                        this.annotations = JSON.parse(saved);
                        console.log('[AnnotationManager] Loaded', this.annotations.length, 'annotations');
                        this.annotations.forEach(a => this.spawnLabel(a));
                    } catch (e) {
                        this.annotations = [];
                    }
                } else {
                    this.annotations = [];
                }
            }
        });

        // 2. ANNOTATION LABEL
        AFRAME.registerComponent('annotation-label', {
            schema: {
                text: { type: 'string', default: '' },
                targetPos: { type: 'vec3' },
                isPreview: { type: 'boolean', default: false }
            },
            init: function () {
                this.textEl = document.createElement('a-entity');
                this.textEl.setAttribute('text', {
                    align: 'center', color: '#FFFFFF', width: 1.5, shader: 'msdf',
                    font: 'https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/roboto/Roboto-Bold.json'
                });
                var bgEl = document.createElement('a-entity');
                bgEl.setAttribute('geometry', { primitive: 'plane', width: 'auto', height: 'auto' });
                bgEl.setAttribute('material', { color: '#000000', opacity: 0.7, transparent: true, side: 'double' });
                bgEl.setAttribute('scale', '0.45 0.2 1');
                bgEl.setAttribute('position', '0 0 -0.01');
                this.textEl.appendChild(bgEl);
                this.lineEl = document.createElement('a-entity');
                this.el.appendChild(this.textEl);
                this.el.appendChild(this.lineEl);
                this.el.setAttribute('look-at', '[camera]');
                this.offset = new THREE.Vector3(0, 0.25, 0);
            },
            update: function () {
                this.textEl.setAttribute('text', 'value', this.data.text);
                var pos = this.data.targetPos;
                this.el.object3D.position.set(pos.x, pos.y, pos.z).add(this.offset);
                var lineColor = this.data.isPreview ? '#00FFFF' : '#FFFF00';
                this.lineEl.setAttribute('line', {
                    start: '0 0 0',
                    end: '0 ' + (-this.offset.y) + ' 0',
                    color: lineColor
                });
            }
        });

        // 3. ANNOTATION RAYCASTER
        AFRAME.registerComponent('annotation-raycaster', {
            dependencies: ['raycaster'],
            init: function () {
                console.log('[AnnotationRaycaster] Init');
                this.onTriggerDown = this.onTriggerDown.bind(this);
                this.onGripDown = this.onGripDown.bind(this);
                this.onIntersection = this.onIntersection.bind(this);
                this.onIntersectionCleared = this.onIntersectionCleared.bind(this);
                this.el.addEventListener('triggerdown', this.onTriggerDown);
                this.el.addEventListener('gripdown', this.onGripDown);
                this.el.addEventListener('raycaster-intersection', this.onIntersection);
                this.el.addEventListener('raycaster-intersection-cleared', this.onIntersectionCleared);
                this.hoveredAtom = null;
                this.hoveredPoint = null;
                this.hoveredMesh = null;
                this.previewEl = document.createElement('a-entity');
                this.previewEl.setAttribute('annotation-label', { text: '', targetPos: { x: 0, y: 0, z: 0 }, isPreview: true });
                this.previewEl.object3D.visible = false;
                this.el.sceneEl.appendChild(this.previewEl);
            },
            remove: function () {
                this.el.removeEventListener('triggerdown', this.onTriggerDown);
                this.el.removeEventListener('gripdown', this.onGripDown);
                this.el.removeEventListener('raycaster-intersection', this.onIntersection);
                this.el.removeEventListener('raycaster-intersection-cleared', this.onIntersectionCleared);
                if (this.previewEl && this.previewEl.parentNode) this.previewEl.parentNode.removeChild(this.previewEl);
                if (this.hoveredMesh) this.removeGlow(this.hoveredMesh);
            },
            onIntersection: function (evt) {
                var raycaster = this.el.components.raycaster;
                var intersection = raycaster.getIntersection(evt.detail.els[0]);
                if (!intersection) return;
                var object = intersection.object;
                var atomData = this.getAtomData(object);
                if (atomData) {
                    console.log('[AnnotationSystem] Hit Atom:', atomData.name);
                    this.hoveredAtom = atomData;
                    this.hoveredPoint = intersection.point;
                    if (this.hoveredMesh !== object) {
                        if (this.hoveredMesh) this.removeGlow(this.hoveredMesh);
                        this.hoveredMesh = object;
                        this.applyGlow(this.hoveredMesh);
                    }
                    this.previewEl.setAttribute('annotation-label', {
                        text: this.formatLabelText(atomData),
                        targetPos: this.hoveredPoint,
                        isPreview: true
                    });
                    this.previewEl.object3D.visible = true;
                }
            },
            onIntersectionCleared: function () {
                if (this.hoveredMesh) {
                    this.removeGlow(this.hoveredMesh);
                    this.hoveredMesh = null;
                }
                this.hoveredAtom = null;
                this.hoveredPoint = null;
                this.previewEl.object3D.visible = false;
            },
            onTriggerDown: function () {
                if (this.hoveredAtom && this.hoveredPoint) {
                    console.log('[AnnotationSystem] Pinning');
                    this.el.sceneEl.emit('pin-annotation', {
                        atomData: this.hoveredAtom,
                        position: this.hoveredPoint
                    });
                }
            },
            onGripDown: function () {
                console.log('[AnnotationSystem] Clearing');
                this.el.sceneEl.emit('clear-annotations');
            },
            applyGlow: function (mesh) {
                if (!mesh.material) return;
                var mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                mats.forEach(mat => {
                    if (!mat.userData.originalEmissive) {
                        mat.userData.originalEmissive = mat.emissive ? mat.emissive.clone() : new THREE.Color(0, 0, 0);
                    }
                    if (mat.emissive) mat.emissive.setHex(0x444444);
                    mat.needsUpdate = true;
                });
            },
            removeGlow: function (mesh) {
                if (!mesh || !mesh.material) return;
                var mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                mats.forEach(mat => {
                    if (mat.userData.originalEmissive) {
                        mat.emissive.copy(mat.userData.originalEmissive);
                    } else {
                        mat.emissive.setHex(0x000000);
                    }
                    mat.needsUpdate = true;
                });
            },
            getAtomData: function (object) {
                var curr = object;
                while (curr) {
                    if (curr.userData) {
                        var atom = curr.userData.presentAtom || curr.userData.atom;
                        if (atom) return atom;
                    }
                    if (curr.userData && curr.userData.group && curr.userData.group === 'main') break;
                    curr = curr.parent;
                }
                return null;
            },
            formatLabelText: function (atom) {
                var res = atom.resname || '???';
                var resid = atom.resid || '';
                var name = atom.name || '';
                return `${res} ${resid}\n${name}`;
            }
        });
        console.log('[AnnotationSystem] INLINED SCRIPT LOADED COMPLETE');
    </script>

    <script src="js/aframe-components/controller-radial-menu.js"></script>
    <script src="js/aframe-components/axis-transform-controls.js"></script>
    <script src="js/aframe-components/vr-locomotion.js"></script>
    <script src="js/aframe-components/vr-keyboard.js"></script>
    <!-- Simplified components -->
    <script src="js/aframe-components/simple-controller-menu.js"></script>
    <script src="js/aframe-components/simple-vr-keyboard.js"></script>
    <!-- DIAGNOSTIC TEST COMPONENTS (Cache-busting) -->
    <script src="js/aframe-components/test-controller-menu.js?v=20251211-1812"
        onerror="console.error('FAILED TO LOAD: test-controller-menu.js')"></script>
    <script src="js/aframe-components/test-vr-keyboard.js?v=20251211-1812"
        onerror="console.error('FAILED TO LOAD: test-vr-keyboard.js')"></script>

    <!-- Verification that HTML updated -->
    <script>
        console.log('===================================================');
        console.log('HTML LOADED: Cache-busting version 20251211-1812');
        console.log('===================================================');
    </script>

    <script>
        // One-time initialization
        window.addEventListener('load', function () {
            if (PDB.render && PDB.render.init) {
                PDB.render.init();
            }
        });
    </script>
</head>

<body>
    <a-scene background="color: #000">
        <!-- Procedural Environment -->
        <a-entity environment-loader="timeOfDay: 0.35"></a-entity>

        <!-- Molecule Container (Target for controls) -->
        <a-entity id="molecule-container" class="molecular-structure" position="0 1.5 -5" scale="0.1 0.1 0.1"
            molecular-renderer="pdbId: 1cbs" axis-transform-controls="hand: right">
        </a-entity>

        <!-- VR Controls -->
        <a-entity id="rig" position="0 0 0" vr-locomotion="speed: 3; fly: true" movement-debug>
            <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: true"></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left" laser-controls="hand: left"
                raycaster="objects: .clickable, .molecular-structure, #molecule-container; far: 50; interval: 100"
                annotation-raycaster></a-entity>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" laser-controls="hand: right"
                raycaster="objects: .clickable; far: 5" test-controller-menu></a-entity>
        </a-entity>


        <!-- Radial Menu -->
        <a-entity id="radial-menu" radial-menu class="clickable"></a-entity>

        <!-- VR Debug Panel REMOVED (Unified into Console) -->
        <!-- <a-entity vr-debug-panel></a-entity> -->

        <!-- VR Console - Shows logs in headset -->
        <a-entity vr-console></a-entity>

        <!-- TEST VR Keyboard (ALWAYS VISIBLE FOR DEBUGGING) -->
        <a-entity id="test-vr-keyboard" test-vr-keyboard position="0 1.5 -1" visible="true"></a-entity>

        <!-- Mouse Cursor for Desktop -->
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <!-- Hidden DOM elements for compatibility with tool.js -->
    <div id="segmentholder" style="display:none;"></div>
    <div id="labelContent" style="display:none;"></div>
    <div id="labelContent_measure" style="display:none;"></div>
    <div id="rightmenu" style="display:none;"></div>
</body>

</html>
